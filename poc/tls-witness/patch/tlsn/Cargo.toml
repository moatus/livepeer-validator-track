# tlsn at the pinned tag, with workspace dependencies resolved explicitly.
# Sibling path dependencies become git dependencies on the same tag. The
# upstream workspace lints are empty; dev-dependencies are omitted as for mux.
# Only session.rs changes; ../tlsn-session-frame-limit.diff is the library diff.

[package]
name = "tlsn"
authors = ["TLSNotary Team"]
keywords = ["tls", "mpc", "2pc", "prover"]
categories = ["cryptography"]
license = "MIT OR Apache-2.0"
version = "0.1.0-alpha.15"
edition = "2024"
build = "build.rs"

[features]
default = ["rayon", "hash-blake3"]
mozilla-certs = ["tlsn-core/mozilla-certs"]
rayon = ["mpz-zk/rayon", "mpz-garble/rayon"]
web = ["dep:web-spawn"]
hash-keccak256 = ["mpz-hash/keccak256"]
hash-blake3 = ["mpz-hash/blake3"]

[dependencies]
tlsn-attestation = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.15" }
tlsn-cipher = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.15" }
tlsn-core = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.15" }
tlsn-deap = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.15" }
tlsn-hmac-sha256 = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.15" }
tlsn-mpc-tls = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.15" }
tlsn-mux = { git = "https://github.com/tlsnotary/tlsn-utils", rev = "64722f7" }
tlsn-tls-client = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.15" }
tlsn-tls-core = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-alpha.15" }
futures-plex = { git = "https://github.com/tlsnotary/tlsn-utils", rev = "64722f7" }
serio = { version = "0.2", features = ["compat"] }
web-spawn = { version = "0.3", optional = true }
mpz-circuits = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6", features = ["aes"] }
mpz-common = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6" }
mpz-core = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6" }
mpz-garble = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6" }
mpz-garble-core = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6" }
mpz-hash = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6", default-features = false, features = ["sha256"] }
mpz-memory-core = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6" }
mpz-ole = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6" }
mpz-ot = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6" }
mpz-vm-core = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6" }
mpz-zk = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6" }
mpz-ideal-vm = { git = "https://github.com/privacy-ethereum/mpz", rev = "v0.1.0-alpha.6" }
aes = { version = "0.8" }
ctr = { version = "0.9" }
futures = { version = "0.3" }
opaque-debug = { version = "0.3" }
pin-project-lite = { version = "0.2" }
rand = { version = "0.9" }
rustls-pki-types = { version = "1.12" }
rustls-webpki = { version = "0.103" }
thiserror = { version = "1.0" }
tracing = { version = "0.1" }
tokio = { version = "1.38", features = ["sync"] }
serde = { version = "1.0", features = ["derive"] }
ghash = { version = "0.5" }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
semver = { version = "1.0", features = ["serde"] }
once_cell = { version = "1.19" }
rangeset = { version = "0.4" }
webpki-roots = { version = "1.0" }
web-time = { version = "0.2" }

[lib]
path = "../apply.sh.out/tlsn/src/lib.rs"
